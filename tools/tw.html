<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>JParty — Tailwind static CSS generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="tw-classes.js"></script>
<style>body{font-family:system-ui;padding:1rem;background:#0f172a;color:#fff} textarea{width:100%;height:50vh;font:12px/1.4 ui-monospace,monospace;background:#020617;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:.5rem} button{padding:.6rem 1rem;border-radius:999px;border:0;font-weight:700;background:#a78bfa;color:#0f172a;cursor:pointer} #stage{position:absolute;left:-9999px;top:0}</style>
</head><body>
<h1 style="font-weight:900">Tailwind → css/tailwind.css</h1>
<p>Renders every candidate class from <code>tools/tw-classes.js</code> through the Play CDN, then dumps the generated stylesheet. Run <code>osascript -l JavaScript tools/tw-extract.js</code> first whenever classes change.</p>
<p id="status">Generating…</p>
<p><button id="dl">Download css/tailwind.css</button> <button id="copy">Copy</button></p>
<textarea id="out" readonly></textarea>
<div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  const list = window.TW_CLASSES || [];
  /* variants (hover:, lg:, sm:) are generated when the class is present in the DOM, so one div with everything is enough;
     chunked so the attribute does not hit absurd lengths */
  for (let i = 0; i < list.length; i += 200) { const d = document.createElement('div'); d.className = list.slice(i, i + 200).join(' '); stage.appendChild(d); }
  function collect() {
    const css = [...document.querySelectorAll('style')].map((s) => s.textContent).filter((t) => /--tw-|tailwindcss/.test(t)).join('\n');
    return '/* Generated by tools/tw.html from ' + list.length + ' candidate classes — do not edit by hand. Regenerate: tools/tw-extract.js → open tools/tw.html */\n' + css;
  }
  setTimeout(() => {
    const css = collect();
    document.getElementById('out').value = css;
    document.getElementById('status').textContent = `Done — ${list.length} candidates → ${(css.length / 1024).toFixed(1)} KB of CSS`;
    window.__twCss = css;
  }, 2500);
  document.getElementById('dl').onclick = () => { const b = new Blob([window.__twCss], { type: 'text/css' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'tailwind.css'; a.click(); };
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(window.__twCss);
</script>
</body></html>
